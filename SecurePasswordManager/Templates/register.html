<!DOCTYPE html>
<html lang="en">
<head><title>Register</title></head>
  <body>
    <h1>Create Account</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
          {% for category, msg in messages %}
            <li><strong>{{ category }}:</strong> {{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="post">
      <label>Username</label><br />
      <input name="username" autocomplete="username" /><br /><br />

      <label>Master Password</label><br />
      <input name="master_password" type="password" autocomplete="new-password" /><br /><br />

      <label>Confirm Master Password</label><br />
      <input name="confirm_password" type="password" autocomplete="new-password" /><br /><br />

      <button type="submit">Register</button>
    </form>

    <p><a href="{{ url_for('login') }}">Already have an account? Log in</a></p>
  </body>
</html>
