<!DOCTYPE html>
<html lang="en">
<head><title>Add Credential</title></head>
  <body>
    <h1>Add Credential</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul>
          {% for category, msg in messages %}
            <li><strong>{{ category }}:</strong> {{ msg }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form method="post">
      <label>Service</label><br />
      <input name="service" /><br /><br />

      <label>Login (username/email)</label><br />
      <input name="login" /><br /><br />

      <label>Password</label><br />
      <input name="password" type="password" /><br /><br />

      <label>Confirm Master Password (required to encrypt)</label><br />
      <input name="master_password" type="password" autocomplete="current-password" /><br /><br />

      <button type="submit">Save</button>
    </form>

    <p><a href="{{ url_for('vault') }}">Back to vault</a></p>
  </body>
</html>
